<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My calculator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
</head>
<body>
    <div class="calculator">
        <div class="content">
            <div class="screen">
                <div class="output"></div>
                <div class="result"></div>
            </div>
            <div class="input">
                <div class="row p-3">
                    <div class="col-3 ">
                        <button type="button" class="btn btn-outline-danger" id="delete"><i class="fa-solid fa-delete-left"></i></button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-warning" id="clear">C</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-warning op" id="percentage">%</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-warning op" id="divide"><i class="fa-solid fa-divide"></i></button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-primary num" id="seven">7</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-primary num" id="eight">8</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-primary num" id="nine">9</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-warning op" id="mul"><i class="fa-solid fa-x"></i></button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-primary num" id="four">4</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-primary num" id="five">5</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-primary num" id="six">6</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-warning op" id="plus"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-primary num" id="one">1</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-primary num" id="two">2</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-primary num" id="three">3</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-warning op" id="minus"><i class="fa-solid fa-minus"></i></button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-primary num" id="zero">0</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-primary num" id="point">.</button>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-success" id="equal">=</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
